[defaults]
inventory            = inventory.ini
roles_path           = roles
host_key_checking    = False
deprecation_warnings = False
retry_files_enabled  = False
stdout_callback      = yaml
interpreter_python   = auto_silent
timeout              = 60

[privilege_escalation]
become          = True
become_method   = sudo
become_user     = root
become_ask_pass = False

[ssh_connection]
# The nodes are freshly built, so accept their host keys without prompting -
# the project requires the whole run to be non-interactive.
#
# ControlMaster/ControlPersist multiplexing is deliberately NOT enabled. With it
# on, privilege escalation intermittently hung on some nodes with
# "Timeout waiting for privilege escalation prompt" while raw sudo on the same
# host returned instantly. Dropping connection sharing makes every run reliable.
ssh_args   = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=no
pipelining = True
